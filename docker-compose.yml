version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: airman
      POSTGRES_PASSWORD: airman_password
      POSTGRES_DB: skynet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airman -d skynet"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://airman:airman_password@db:5432/skynet
      SECRET_KEY: "supersecretkey_please_change_in_production"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
